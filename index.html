<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习工具-七年级上册专项 | 神人众集团</title>
    <link rel="stylesheet" href="style.css">
    <!-- ===== PDF.JS CDN 引入 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
    <style>
        /* PDF预览弹窗额外样式 */
        .pdf-preview-mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.75);
            z-index:9999;
            display:none;
            align-items:center;
            justify-content:center;
            padding:16px;
        }
        .pdf-preview-box{
            width:min(95%, 900px);
            height:min(90vh, 850px);
            background:#fff;
            border-radius:12px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .pdf-preview-head{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 16px;
            border-bottom:1px solid #eee;
        }
        .pdf-preview-canvas-wrap{
            flex:1;
            overflow:auto;
            background:#e8e8e8;
            display:flex;
            justify-content:center;
            padding:20px 0;
        }
        #pdfCanvas{
            box-shadow:0 2px 12px #0003;
        }
        .pdf-preview-toolbar{
            display:flex;
            gap:10px;
            align-items:center;
        }
        .pdf-preview-toolbar button{
            padding:4px 10px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== 首页 ========== -->
        <div class="page page-home" id="pageHome">
            <header class="site-header">
                <img src="https://aka.doubaocdn.com/s/IV7L1wyU7r" alt="Logo" class="site-logo">
                <div class="title-text">
                    <h1>学习工具-七年级上册专项</h1>
                    <p class="company">神人众集团 出品</p>
                </div>
            </header>

            <section class="section">
                <h2 class="section-title">常用工具</h2>
                <div class="tool-grid">
                    <div class="tool-card" onclick="showModal('校历', '敬请期待')">
                        <img src="https://aka.doubaocdn.com/s/zELb1wyU7r" alt="校历" class="tool-img">
                        <h3>校历</h3>
                        <p>查看学期校历安排</p>
                    </div>
                    <div class="tool-card" onclick="showModal('课程表', '敬请期待')">
                        <img src="https://aka.doubaocdn.com/s/9gJm1wyU7o" alt="课程表" class="tool-img">
                        <h3>课程表</h3>
                        <p>定制专属课程表</p>
                    </div>
                    <div class="tool-card" onclick="goTest()">
                        <img src="https://aka.doubaocdn.com/s/0td41wyU7r" alt="学习计划" class="tool-img">
                        <h3>制定学习计划</h3>
                        <p>智能测评生成专属计划</p>
                    </div>
                    <div class="tool-card" onclick="showBookModal()">
                        <img src="https://aka.doubaocdn.com/s/Kwte1wyU7p" alt="题库" class="tool-img">
                        <h3>题库</h3>
                        <p>七科同步练习题</p>
                    </div>
                    <div class="tool-card" onclick="window.open('https://pomodoro.so/zh', '_blank')">
                        <img src="https://aka.doubaocdn.com/s/IDLT1wyU7r" alt="番茄钟" class="tool-img">
                        <h3>番茄钟</h3>
                        <p>专注学习计时工具</p>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">科目学习</h2>
                <div class="subject-grid" id="subjectGrid"></div>
            </section>

            <footer class="site-footer">
                <p>© 2026 神人众集团 版权所有</p>
            </footer>
        </div>

        <!-- ========== 测评页面 ========== -->
        <div class="page page-test" id="pageTest" style="display:none;">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="page-title">小升初学情智能测评</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">第 1 / 26 题</p>
            
            <div class="question-box" id="questionBox"></div>
            
            <div class="test-btns">
                <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>

        <!-- ========== 测评结果页 ========== -->
        <div class="page page-result" id="pageResult" style="display:none;">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <div class="result-card" id="resultCard"></div>
            <div class="test-btns">
                <button class="btn-primary" onclick="restartTest()">重新测评</button>
            </div>
        </div>

        <!-- ========== 科目详情页 ========== -->
        <div class="page page-subject" id="pageSubject" style="display:none;">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="page-title" id="subjectTitle"></h2>
            <div class="subject-detail-grid" id="detailContent">
            </div>
        </div>
    </div>

    <!-- 通用弹窗 -->
    <div class="modal-mask" id="modalMask" onclick="closeModal(event)" style="display:none;">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 id="modalTitle"></h3>
            <p id="modalContent"></p>
            <div id="modalExtra"></div>
            <button class="btn-primary" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <!-- ===== PDF预览弹窗【新增】 ===== -->
    <div class="pdf-preview-mask" id="pdfMask" onclick="closePdfPreview()">
        <div class="pdf-preview-box" onclick="event.stopPropagation()">
            <div class="pdf-preview-head">
                <h3 id="pdfTitle">教材原书预览</h3>
                <div class="pdf-preview-toolbar">
                    <button onclick="prevPdfPage()">上一页</button>
                    <span id="pdfPageInfo">0 / 0</span>
                    <button onclick="nextPdfPage()">下一页</button>
                    <button onclick="closePdfPreview()">关闭</button>
                </div>
            </div>
            <div class="pdf-preview-canvas-wrap">
                <canvas id="pdfCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="test.js"></script>
    <script src="main.js"></script>
</body>
</html>
